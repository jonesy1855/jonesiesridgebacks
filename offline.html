<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline &middot; Jonesies Ridgebacks</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#b5532a">
  <link rel="stylesheet" href="/css/site.css">
  <style>
    body {
      background: #fbf3e8;
      color: #3a2a20;
      font-family: Georgia, "Times New Roman", serif;
      margin: 0;
      padding: 0;
    }
    .offline-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      box-sizing: border-box;
    }
    .offline-emoji {
      font-size: 3.5rem;
      line-height: 1;
      margin-bottom: 1rem;
    }
    .offline-wrap h1 {
      color: #b5532a;
      margin: 0 0 0.75rem;
    }
    .offline-wrap p {
      max-width: 34rem;
      line-height: 1.6;
      margin: 0 auto 1.5rem;
    }
    .offline-btn {
      display: inline-block;
      background: #b5532a;
      color: #fff;
      text-decoration: none;
      padding: 0.8rem 1.6rem;
      border-radius: 6px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <main class="offline-wrap">
    <div class="offline-emoji" aria-hidden="true">🐾</div>
    <h1>You&rsquo;re offline</h1>
    <p>
      It looks like you&rsquo;ve lost your connection. Pages and photos
      you&rsquo;ve already visited are still saved on your phone &mdash; try the
      menu, or reconnect and refresh.
    </p>
    <a class="offline-btn" href="/">Try again</a>
  </main>

</body>
</html>
